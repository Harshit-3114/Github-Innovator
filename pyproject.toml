[project]
name = "github-innovator"
version = "0.1.0"
description = "AI agent that discovers popular repos, analyzes them, plans innovations, implements changes, and publishes forks"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "pygithub>=2.6.0",
    "gitpython>=3.1.0",
    "openai>=1.70.0",
    "typer>=0.15.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.1.0",
    "rich>=13.0.0",
    "textual>=1.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
innovator = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*", "tui*", "core*", "agents*", "db*"]

[tool.ruff]
line-length = 100
target-version = "py311"
