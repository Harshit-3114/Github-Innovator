name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Pinned so the lint result does not move when ruff changes its
        # default rule set. Bump it deliberately, then fix what it finds.
        pip install ruff==0.17.5

    - name: Lint with ruff
      # The configuration lives in pyproject.toml ([tool.ruff]).
      run: ruff check .

    - name: Test with pytest
      # The suite is offline: no NVIDIA NIM key and no GitHub token needed.
      run: pytest tests/ -v --tb=short
